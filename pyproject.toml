[project]
name = "learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faustin IYAREMYE", email = "iyaremyef@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
dev = "learning.cli:dev"
makemigrations = "learning.cli:makemigrations"
migrate = "learning.cli:migrate"
rollback = "learning.cli:rollback"
migration-status = "learning.cli:migration_status"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
